openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clues
    description: Cryptic clue challenges
  - name: profile
    description: Signed-in solver profile
  - name: moderation
    description: Clue appeal review
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /clues:
    get:
      operationId: listClues
      tags: [clues]
      summary: Browse published clues
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, rating]
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by the previous clue page
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: A stable page of published clue challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueCatalogPage"
        "400":
          description: Invalid clue listing cursor
    post:
      operationId: createClue
      tags: [clues]
      summary: Create a clue challenge
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClueInput"
      responses:
        "201":
          description: Created clue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clue"
        "409":
          description: Complete public ID setup before publishing
        "429":
          description: Daily published-clue limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CluePublishLimitError"
  /clues/publishing-quota:
    get:
      operationId: getCluePublishQuota
      tags: [clues]
      summary: Get the signed-in setter's daily publication quota
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current UTC-day publication quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CluePublishQuota"
        "401":
          description: Sign in to view publication quota
  /clues/recommendation:
    get:
      operationId: getNextClueRecommendation
      tags: [clues]
      summary: Recommend an unsolved playable clue
      security:
        - clerkSession: []
      parameters:
        - name: excludeSlug
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 16
      responses:
        "200":
          description: The most popular eligible clue, if one remains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueRecommendation"
        "400":
          description: Invalid clue recommendation request
        "401":
          description: Sign in to get a clue recommendation
  /clues/{slug}:
    get:
      operationId: getClue
      tags: [clues]
      summary: Get a shared clue challenge
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Clue challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clue"
        "404":
          description: Clue not found
        "410":
          description: Clue has been retired or blocked after community reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueRetired"
    delete:
      operationId: retireClue
      tags: [clues]
      summary: Retire a clue challenge
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Clue retired; attempt and leaderboard history retained
        "403":
          description: Only the original setter can retire this clue
        "404":
          description: Clue not found
        "410":
          description: Clue has already been retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueRetired"
  /clues/{slug}/report:
    post:
      operationId: reportClue
      tags: [clues]
      summary: Report a clue
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report recorded or already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueReportResult"
        "401":
          description: Sign in to report a clue
        "403":
          description: Setters cannot report their own clue
        "404":
          description: Clue not found
        "410":
          description: Clue has been retired or blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueRetired"
  /clues/{slug}/appeal:
    post:
      operationId: submitClueAppeal
      tags: [clues]
      summary: Appeal a blocked clue
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClueAppealInput"
      responses:
        "201":
          description: Appeal submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueAppealResult"
        "403":
          description: Only the setter can appeal this clue
        "404":
          description: Clue not found
        "409":
          description: Clue is not eligible or already has a pending appeal
  /review/appeals:
    get:
      operationId: listPendingClueAppeals
      tags: [moderation]
      summary: List pending clue appeals for reviewers
      security:
        - clerkSession: []
      responses:
        "200":
          description: Pending appeals with clue and report details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClueAppealReview"
        "403":
          description: Reviewer access required
  /review/appeals/{appealId}/decision:
    post:
      operationId: reviewClueAppeal
      tags: [moderation]
      summary: Restore or retire an appealed clue
      security:
        - clerkSession: []
      parameters:
        - name: appealId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClueAppealDecision"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueAppealDecisionResult"
        "403":
          description: Reviewer access required
        "404":
          description: Appeal not found
        "409":
          description: Appeal has already been reviewed or clue is unavailable
  /clues/{slug}/rating:
    put:
      operationId: rateClue
      tags: [clues]
      summary: Rate a clue after solving it
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClueRatingInput"
      responses:
        "200":
          description: Saved rating and current average
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueRatingSummary"
        "403":
          description: Only a solver who completed the clue can rate it
        "404":
          description: Clue not found
        "410":
          description: Clue has been retired or blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueRetired"
  /leaderboards/solvers:
    get:
      operationId: getSolverLeaderboard
      tags: [profile]
      summary: Rank solvers by average successful solve time
      responses:
        "200":
          description: Fastest average solve times
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SolverLeaderboardEntry"
  /leaderboards/setters:
    get:
      operationId: getSetterLeaderboard
      tags: [profile]
      summary: Rank setters by average clue rating
      responses:
        "200":
          description: Highest average setter ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SetterLeaderboardEntry"
  /clues/{slug}/leaderboard:
    get:
      operationId: getClueLeaderboard
      tags: [clues]
      summary: Get a clue leaderboard
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Independently ranked successful solves by hint usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueLeaderboard"
        "410":
          description: Clue has been retired or blocked after community reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueRetired"
  /clues/{slug}/attempts:
    post:
      operationId: submitAttempt
      tags: [clues]
      summary: Submit an answer attempt
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptInput"
      responses:
        "200":
          description: Attempt result and updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"
        "404":
          description: Clue not found
        "403":
          description: Setters cannot compete on their own clue
        "409":
          description: Complete public ID setup before solving
        "410":
          description: Clue has been retired or blocked after community reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueRetired"
  /clues/{slug}/start:
    post:
      operationId: startClue
      tags: [clues]
      summary: Start or resume a clue challenge
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolveModeInput"
      responses:
        "200":
          description: Current solver progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueStartResult"
        "404":
          description: Clue not found
        "403":
          description: Setters cannot compete on their own clue
        "409":
          description: Complete public ID setup before solving
        "410":
          description: Clue has been retired or blocked after community reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueRetired"
  /clues/{slug}/give-up:
    post:
      operationId: giveUpClue
      tags: [clues]
      summary: Give up on an active clue
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run ended and solution revealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"
        "401":
          description: Sign in to give up on a clue
        "403":
          description: Setters cannot compete on their own clue
        "404":
          description: Clue not found
        "409":
          description: Start the clue before giving up
        "410":
          description: Clue has been retired or blocked after community reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueRetired"
  /clues/{slug}/hints:
    post:
      operationId: revealClueHint
      tags: [clues]
      summary: Reveal the next hint during an active solve
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The next hint and updated hint count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueHintReveal"
        "401":
          description: Sign in to reveal a hint
        "403":
          description: Setters cannot solve their own clue
        "404":
          description: Clue not found
        "409":
          description: An active solve is required or no hints remain
        "410":
          description: Clue is retired or blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClueRetired"
  /me/dashboard:
    get:
      operationId: getMyDashboard
      tags: [profile]
      summary: Get current user's clue and solve activity
      security:
        - clerkSession: []
      responses:
        "200":
          description: Personal dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /me/activity:
    get:
      operationId: getMyActivity
      tags: [profile]
      summary: Get a page of the current user's solve activity
      security:
        - clerkSession: []
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: A page of personal solve activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolverActivityPage"
        "401":
          description: Sign in to view solve activity
  /me/profile:
    get:
      operationId: getMyProfile
      tags: [profile]
      summary: Get or create the signed-in user's public profile
      security:
        - clerkSession: []
      responses:
        "200":
          description: Public profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
    patch:
      operationId: updateMyProfile
      tags: [profile]
      summary: Update public profile settings
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "400":
          description: Invalid public ID
        "409":
          description: Public ID is already in use
  /me/account:
    delete:
      operationId: deleteMyAccount
      tags: [profile]
      summary: Delete the signed-in account and retain public history
      description: Deletes the Clerk sign-in and public blurb while retaining the reserved public ID, published clues, solves, and ratings under that ID.
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionInput"
      responses:
        "204":
          description: Account deleted and public history retained under the reserved ID
        "400":
          description: Confirmation did not match the current public ID
        "401":
          description: Sign in to delete your account
        "500":
          description: Sign-in removed but public-profile cleanup could not be completed
        "502":
          description: Account deletion could not be completed
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Clue:
      type: object
      required: [id, slug, clue, answerLength, maxAttempts, setterName, setterBlurb, averageRating, ratingCount, userRating, userHasReported, createdAt, userAttemptsUsed, userCompleted, userElapsedSeconds, userStartedAt, userAssistEnabled, userSolved, revealedAnswer, userRevealedHints, hintCount]
      properties:
        id: { type: integer }
        slug: { type: string }
        clue: { type: string }
        answerLength: { type: integer }
        wordplay: { type: ["string", "null"] }
        maxAttempts: { type: integer }
        setterName: { type: string }
        setterBlurb: { type: ["string", "null"] }
        averageRating: { type: ["number", "null"] }
        ratingCount: { type: integer }
        userRating: { type: ["integer", "null"] }
        userHasReported: { type: boolean }
        isOwner: { type: boolean }
        createdAt: { type: string, format: date-time }
        userAttemptsUsed: { type: ["integer", "null"] }
        userCompleted: { type: ["boolean", "null"] }
        userElapsedSeconds: { type: ["integer", "null"] }
        userStartedAt: { type: ["string", "null"], format: date-time }
        userAssistEnabled: { type: ["boolean", "null"] }
        userSolved: { type: ["boolean", "null"] }
        revealedAnswer: { type: ["string", "null"] }
        userRevealedHints:
          type: array
          items: { type: string }
        hintCount: { type: integer, minimum: 0, maximum: 3 }
        isBlocked: { type: boolean }
        reportCount: { type: ["integer", "null"] }
        appealStatus:
          type: ["string", "null"]
          enum: [pending, restored, retired, null]
        appealReason: { type: ["string", "null"] }
    ClueSummary:
      type: object
      required: [id, slug, clue, answerLength, maxAttempts, setterName, setterBlurb, solveCount, averageRating, ratingCount, isBlocked, createdAt]
      properties:
        id: { type: integer }
        slug: { type: string }
        clue: { type: string }
        answerLength: { type: integer }
        maxAttempts: { type: integer }
        setterName: { type: string }
        setterBlurb: { type: ["string", "null"] }
        solveCount: { type: integer }
        averageRating: { type: ["number", "null"] }
        ratingCount: { type: integer }
        isBlocked: { type: boolean }
        createdAt: { type: string, format: date-time }
    ClueCatalogPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClueSummary"
        nextCursor: { type: ["string", "null"] }
    ClueRecommendation:
      type: object
      required: [clue]
      properties:
        clue:
          oneOf:
            - $ref: "#/components/schemas/ClueSummary"
            - type: "null"
    ClueInput:
      type: object
      required: [clue, answer, wordplay, maxAttempts]
      properties:
        clue: { type: string, minLength: 4, maxLength: 240 }
        answer: { type: string, minLength: 1, maxLength: 40 }
        wordplay: { type: string, minLength: 1, maxLength: 1000 }
        maxAttempts: { type: integer, minimum: 1, maximum: 10 }
        hints:
          type: array
          maxItems: 3
          items: { type: string, minLength: 1, maxLength: 300 }
    ClueHintReveal:
      type: object
      required: [hint, hintsRevealed]
      properties:
        hint: { type: string }
        hintsRevealed: { type: integer, minimum: 1, maximum: 3 }
    ClueRetired:
      type: object
      required: [error]
      properties:
        error: { type: string }
    CluePublishLimitError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    CluePublishQuota:
      type: object
      required: [limit, publishedToday, remaining, resetsAt]
      properties:
        limit: { type: integer }
        publishedToday: { type: integer }
        remaining: { type: integer }
        resetsAt: { type: string, format: date-time }
    AttemptInput:
      type: object
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 80 }
    AttemptResult:
      type: object
      required: [correct, attemptsUsed, attemptsRemaining, completed, elapsedSeconds]
      properties:
        correct: { type: boolean }
        attemptsUsed: { type: integer }
        attemptsRemaining: { type: integer }
        completed: { type: boolean }
        elapsedSeconds: { type: integer }
        message: { type: string }
        feedback:
          type: array
          items: { type: string, enum: [green, yellow, neutral] }
    SolveModeInput:
      type: object
      properties:
        assistEnabled: { type: boolean, default: false }
    ClueStartResult:
      type: object
      required: [attemptsUsed, attemptsRemaining, completed, elapsedSeconds, startedAt, assistEnabled]
      properties:
        attemptsUsed: { type: integer }
        attemptsRemaining: { type: integer }
        completed: { type: boolean }
        elapsedSeconds: { type: integer }
        startedAt: { type: string, format: date-time }
        assistEnabled: { type: boolean }
    LeaderboardEntry:
      type: object
      required: [rank, displayName, elapsedSeconds, attemptsUsed, solvedAt]
      properties:
        rank: { type: integer }
        displayName: { type: string }
        elapsedSeconds: { type: integer }
        attemptsUsed: { type: integer }
        solvedAt: { type: string, format: date-time }
    ClueLeaderboard:
      type: object
      required: [noHintsNoAssist, hintsUsedNoAssist, assistUsed]
      properties:
        noHintsNoAssist:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardEntry" }
        hintsUsedNoAssist:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardEntry" }
        assistUsed:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardEntry" }
    Dashboard:
      type: object
      required: [created, solved, recentClues, recentActivity, hasMoreActivity]
      properties:
        created: { type: integer }
        solved: { type: integer }
        recentClues:
          type: array
          items:
            $ref: "#/components/schemas/ClueSummary"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/SolverActivity"
        hasMoreActivity: { type: boolean }
    SolverActivity:
      type: object
      required: [id, slug, clue, answerLength, maxAttempts, setterName, attemptsUsed, attemptsRemaining, state, elapsedSeconds, startedAt]
      properties:
        id: { type: integer }
        slug: { type: string }
        clue: { type: string }
        answerLength: { type: integer }
        maxAttempts: { type: integer }
        setterName: { type: string }
        attemptsUsed: { type: integer }
        attemptsRemaining: { type: integer }
        state:
          type: string
          enum: [in-progress, solved, failed]
        elapsedSeconds: { type: integer }
        startedAt: { type: string, format: date-time }
    SolverActivityPage:
      type: object
      required: [activities, nextOffset]
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/SolverActivity"
        nextOffset: { type: ["integer", "null"] }
    PublicProfile:
      type: object
      required: [publicId, claimedPublicIds, isGuest, needsSetup, blurb]
      properties:
        publicId: { type: string }
        claimedPublicIds:
          type: array
          description: Public IDs previously claimed by the signed-in account, including its current ID.
          items: { type: string }
        isGuest: { type: boolean }
        needsSetup: { type: boolean }
        blurb: { type: ["string", "null"] }
    ProfileInput:
      type: object
      properties:
        publicId:
          type: string
          maxLength: 48
          description: A new ID must use 3–24 letters, numbers, underscores, or hyphens; an ID already claimed by this account may be restored.
        blurb:
          type: string
          maxLength: 280
    AccountDeletionInput:
      type: object
      required: [confirmationPublicId]
      properties:
        confirmationPublicId:
          type: string
          minLength: 3
          maxLength: 48
          description: The signed-in user's current public ID, entered to confirm permanent deletion.
    ClueRatingInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
    ClueRatingSummary:
      type: object
      required: [averageRating, ratingCount, userRating]
      properties:
        averageRating: { type: ["number", "null"] }
        ratingCount: { type: integer }
        userRating: { type: integer }
    ClueReportResult:
      type: object
      required: [reportCount, threshold, blocked, alreadyReported]
      properties:
        reportCount: { type: integer }
        threshold: { type: integer, enum: [100] }
        blocked: { type: boolean }
        alreadyReported: { type: boolean }
    ClueAppealInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 1000 }
    ClueAppealResult:
      type: object
      required: [id, status, reportCount, submittedAt]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending] }
        reportCount: { type: integer }
        submittedAt: { type: string, format: date-time }
    ClueAppealReview:
      type: object
      required: [id, slug, clue, answer, wordplay, setterName, reason, reportCount, submittedAt]
      properties:
        id: { type: integer }
        slug: { type: string }
        clue: { type: string }
        answer: { type: string }
        wordplay: { type: ["string", "null"] }
        setterName: { type: string }
        reason: { type: string }
        reportCount: { type: integer }
        submittedAt: { type: string, format: date-time }
    ClueAppealDecision:
      type: object
      required: [action]
